<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RajuBird - hek3i</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Squada One", sans-serif;
    }

    body {
        background: linear-gradient(180deg, #6dcff6, #ffffff);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        text-align: center;
        transition: background 0.4s, color 0.3s;
    }

    /* DARK MODE */
    body.dark {
        background: linear-gradient(180deg, #111, #1d1d1d);
        color: white;
    }

    h2 {
        font-size: 42px;
        letter-spacing: 2px;
        color: #222;
        text-shadow: 2px 2px 0px #fff;
        margin-bottom: 15px;
        transition: 0.3s;
    }

    body.dark h2 {
        text-shadow: none;
        color: #f2f2f2;
    }

    /* Dark Mode Button */
    #darkToggle {
        position: fixed;
        top: 15px;
        right: 15px;
        background: #222;
        color: white;
        padding: 8px 16px;
        border-radius: 10px;
        border: none;
        cursor: pointer;
        font-size: 18px;
        transition: 0.2s;
        z-index: 999;
    }

    body.dark #darkToggle {
        background: #f8b400;
        color: #000;
    }

    canvas {
        background: #53c258;
        border: 3px solid #000;
        border-radius: 14px;
        max-width: 100%;
        height: auto;
        transition: 0.3s;
    }

    body.dark canvas {
        border-color: white;
    }

    footer {
        margin-top: 25px;
        font-size: 14px;
    }

    footer a {
        color: inherit;
        text-decoration: underline;
    }
</style>
</head>

<body>

<button id="darkToggle">Dark Mode</button>

<h2>RAJU BIRD</h2>

<!-- EXACT size needed for game.js physics -->
<canvas id="canvas" width="276" height="550"></canvas>

<footer>
    <p class="credit">made by <a href="https://instagram.com/hek3i">hek3i</a></p>
    <p class="fork">fork of <a href="https://github.com/aaarafat/JS-Flappy-Bird">aaarafat/JS-Flappy-Bird</a></p>
</footer>

<script src="game.js"></script>

<script>
    // DARK MODE TOGGLE
    const toggle = document.getElementById("darkToggle");

    toggle.addEventListener("click", () => {
        document.body.classList.toggle("dark");
    });
</script>

</body>
</html>
